# Generates SiteioCompanion.xcodeproj (not committed): run `xcodegen generate`.
name: SiteioCompanion
options:
  bundleIdPrefix: com.plosson
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Ad-hoc ("Sign to Run Locally") for local builds; scripts/release.sh signs Release with Developer ID.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Release:
      CODE_SIGN_IDENTITY: Developer ID Application
packages:
  HoulahopUpdater:
    path: ../../scripts/mac-release
targets:
  SiteioCompanion:
    type: application
    platform: macOS
    sources: [SiteioCompanion]
    dependencies:
      - package: HoulahopUpdater
    info:
      path: SiteioCompanion/Info.plist
      properties:
        CFBundleDisplayName: SiteIO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Copyright © Pierre A. Losson
        NSAppTransportSecurity:
          # Dev agents on http://127.0.0.1 / localhost (Debug builds only accept them).
          NSAllowsLocalNetworking: true
        # Sparkle: scripts/release.sh uploads appcast.xml to each GitHub release, so "latest" always points to the newest one.
        SUFeedURL: https://github.com/plosson/siteio-app/releases/latest/download/appcast.xml
        SUPublicEDKey: w8N1Qyd4RwZm51go+WnxVEWoGvSs546P/t7jbUlDPKA=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plosson.siteio-companion
        PRODUCT_NAME: SiteIO
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # No App Sandbox, as AgentIO: Sparkle installs updates in place.
        ENABLE_HARDENED_RUNTIME: YES
  SiteioCompanionTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SiteioCompanionTests]
    dependencies:
      - target: SiteioCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # The app's product is "SiteIO", not the target's name.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SiteIO.app/Contents/MacOS/SiteIO
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  SiteioCompanion:
    build:
      targets:
        SiteioCompanion: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [SiteioCompanionTests]
    archive:
      config: Release
